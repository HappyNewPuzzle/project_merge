services:
  mysql:
    # 애플리케이션의 명시적 MySqlServerVersion과 동일한 버전으로 고정합니다.
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: merge_game
      MYSQL_USER: merge_game_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mergegame-mysql-data:/var/lib/mysql
    healthcheck:
      # 비밀번호를 명령줄 인수에 노출하지 않고 컨테이너 환경 변수에서 읽습니다.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MergeGameDatabase: Server=mysql;Port=3306;Database=merge_game;User=merge_game_app;Password=${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
    ports:
      - "8080:8080"

volumes:
  # docker compose down만으로는 삭제되지 않는 이름 있는 볼륨입니다.
  mergegame-mysql-data:
